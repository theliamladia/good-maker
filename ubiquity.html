<body class="ub-page">

<header class="site-header">
  <a class="wordmark" href="./">GOOD®</a>
  <nav class="site-nav" aria-label="Main">
    <a class="nav-link mono" href="./">MAKER®</a>
    <a class="nav-link mono" href="releases">RELEASES®</a>
    <a class="nav-link mono" href="market">MARKET®</a>
    <a class="nav-link mono" href="colors">COLORS®</a>
    <a class="nav-link mono" href="study">STUDY®</a>
    <a class="nav-link mono" href="members">MEMBERS®</a>
    <a class="nav-link mono" href="collaborations">COLLABORATIONS®</a>
    <a class="nav-link mono" href="account" data-acct>ACCOUNT</a>
  </nav>
</header>

<main class="ub-main">
  <!-- Locked: nothing of the project is in this page; it arrives from /api/ubiquity after the password. -->
  <form class="ub-lock" id="lock" autocomplete="off">
    <p class="ub-tag mono">UBIQUITY</p>
    <h1 class="ub-title">Locked.</h1>
    <label class="ub-field">
      <span class="mono">PASSWORD</span>
      <input type="password" id="pw" autocomplete="off" spellcheck="false" autocapitalize="characters" required>
    </label>
    <button type="submit" class="ub-go mono" id="go">OPEN</button>
    <p class="ub-msg mono" id="msg" aria-live="polite"></p>
  </form>
  <article class="ub-doc" id="doc" hidden></article>
</main>

<footer class="site-foot mono">© 2026 GOOD®. All rights reserved. · <a class="foot-link" href="/privacy">PRIVACY</a></footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let pw = '';
  const call = async (extra) => {
    const r = await fetch('/api/ubiquity', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pw, ...extra }) });
    if (!r.ok) throw new Error(String(r.status));
    return r.json();
  };
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const blob = (f) => URL.createObjectURL(new Blob([Uint8Array.from(atob(f.data), (c) => c.charCodeAt(0))], { type: f.type }));

  $('lock').onsubmit = async (e) => {
    e.preventDefault();
    pw = $('pw').value.trim();
    $('go').disabled = true; $('msg').textContent = 'CHECKING…';
    let m;
    try { m = await call({}); } catch { $('msg').textContent = 'NOPE.'; $('go').disabled = false; pw = ''; return; }
    $('lock').hidden = true;
    render(m);
  };

  function render({ content, files }) {
    const byName = Object.fromEntries(files.map((f) => [f.name, f]));
    const projects = content.projects || [content];
    const doc = $('doc');
    doc.hidden = false;
    // Project files: one tab each; a project's images load the first time it opens.
    const tabs = el('nav', 'ub-tabs mono'); tabs.setAttribute('aria-label', 'Project files');
    const panes = projects.map((pr) => {
      const pane = el('div', 'ub-proj'); pane.hidden = true; pane.filled = false;
      const tab = el('button', 'ub-tab', pr.title); tab.type = 'button';
      tab.onclick = () => show(pane);
      pane.tab = tab; pane.pr = pr; tabs.append(tab); doc.append(pane);
      return pane;
    });
    if (projects.length > 1) doc.prepend(tabs);
    function show(pane) {
      for (const p of panes) { p.hidden = p !== pane; p.tab.setAttribute('aria-current', p === pane ? 'page' : 'false'); }
      if (!pane.filled) { pane.filled = true; fill(pane, pane.pr); }
      try { localStorage.setItem('ub:proj', pane.pr.id || pane.pr.title); } catch { /* fine */ }
    }
    let last = null; try { last = localStorage.getItem('ub:proj'); } catch { /* fine */ }
    show(panes.find((p) => (p.pr.id || p.pr.title) === last) || panes[0]);

    function fill(pane, pr) {
      pane.append(el('p', 'ub-tag mono', pr.kicker), el('h1', 'ub-title', pr.title), el('p', 'ub-date mono', `UPDATED ${pr.updated}`));
      for (const s of pr.sections) {
        const sec = el('section', 'ub-sec');
        sec.append(el('h2', null, s.h));
        for (const p of s.p || []) sec.append(el('p', 'ub-p', p));
        if (s.list) { const ul = el('ul', 'ub-list'); s.list.forEach((t) => ul.append(el('li', null, t))); sec.append(ul); }
        for (const name of s.img || []) {
          const fig = el('figure', 'ub-fig'); const img = el('img'); img.alt = name; img.draggable = false;
          fig.append(img, el('figcaption', 'mono', name)); sec.append(fig);
          load(byName[name], (u) => { img.src = u; });
        }
        if (s.files) {
          const row = el('div', 'ub-tex');
          for (const name of s.files) {
            const box = el('figure', 'ub-texbox'); const img = el('img'); img.alt = name; box.append(img, el('figcaption', 'mono', name)); row.append(box);
            load(byName[name], (u) => { img.src = u; });
          }
          sec.append(row);
        }
        for (const name of s.code || []) {
          const d = el('details', 'ub-code'); d.append(el('summary', 'mono', name)); const pre = el('pre'); d.append(pre); sec.append(d);
          d.addEventListener('toggle', () => { if (d.open && !pre.textContent) load(byName[name], null, (t) => { pre.textContent = t; }); }, { once: false });
        }
        pane.append(sec);
      }
    }
  }
  async function load(f, onUrl, onText) {
    if (!f) return;
    try {
      const r = await call({ file: f.id });
      if (onText) onText(new TextDecoder().decode(Uint8Array.from(atob(r.data), (c) => c.charCodeAt(0))));
      else onUrl(blob(r));
    } catch { /* leave it empty */ }
  }
})();
</script>
<script src="js/nav.js"></script>
</body>
</html>
