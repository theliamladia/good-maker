<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COLORS® · GOOD® DESIGN</title>
  <meta name="description" content="ALL ® OUR ® COLORS: every GOOD® colour in one place.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="cl-page">

<div class="crt-scanlines" aria-hidden="true"></div>
<div class="crt-vignette" aria-hidden="true"></div>
<div class="hero-sky" aria-hidden="true">
  <div class="cloud cloud-1"></div>
  <div class="cloud cloud-2"></div>
  <div class="cloud cloud-3"></div>
  <div class="cloud cloud-4"></div>
</div>

<header class="site-header">
  <a class="wordmark" href="./">GOOD® <span>DESIGN</span></a>
  <nav class="site-nav" aria-label="Main">
    <a class="nav-link mono" href="./">← BACK</a>
  </nav>
</header>

<main class="cl-main">
  <section class="cl-hero">
    <div class="section-tag mono">COLORS®</div>
    <h1 class="cl-title">ALL <span>®</span> OUR <span>®</span> COLORS</h1>
    <p class="cl-copy">GOOD® uses proprietary techniques to source truly unique color algorithms for its creations. For your enjoyment, we have prepared all current existing colors here.</p>
    <p class="cl-count mono" id="clCount"></p>
    <p class="cl-hint mono">CLICK A COLOR TO LEARN MORE</p>
  </section>
  <div class="cl-grid" id="clGrid"></div>
</main>

<!-- One colour up close: half the colour, half its name and story. -->
<div class="cl-modal" id="clModal" hidden>
  <div class="cl-backdrop" data-close></div>
  <div class="cl-sheet" role="dialog" aria-modal="true" aria-labelledby="clmName">
    <div class="cl-m-color" id="clmColor"><span class="cl-m-num mono" id="clmNum"></span></div>
    <div class="cl-m-info">
      <button type="button" class="cl-m-close mono" data-close aria-label="Close">✕</button>
      <div class="section-tag mono">COLORS®</div>
      <h2 class="cl-m-name" id="clmName"></h2>
      <div class="cl-m-hex mono" id="clmHex"></div>
      <p class="cl-m-desc" id="clmDesc"></p>
      <div class="cl-m-where mono" id="clmWhere"></div>
      <div class="cl-m-nav">
        <button type="button" class="nav-link mono" id="clmPrev">← PREV</button>
        <span class="cl-m-pos mono" id="clmPos"></span>
        <button type="button" class="nav-link mono" id="clmNext">NEXT →</button>
      </div>
    </div>
  </div>
</div>

<script src="js/colors.js"></script>
<script>
  // Colour cards from js/colors.js (the list to update when a colour ships).
  (() => {
    const grid = document.getElementById('clGrid');
    const colors = window.GOOD_COLORS;
    document.getElementById('clCount').textContent = `${colors.length} COLORS`;
    colors.forEach((c, i) => {
      const hexes = Array.isArray(c.hex) ? c.hex : [c.hex];
      const fill = hexes.length > 1 ? `linear-gradient(90deg, ${hexes[0]} 50%, ${hexes[1]} 50%)` : hexes[0];
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'cl-card';
      card.style.setProperty('--d', `${Math.min(i, 24) * 40}ms`);
      card.setAttribute('aria-label', `${c.name}™, learn more`);
      card.innerHTML = `
        <div class="cl-swatch" style="background:${fill}"><span class="cl-num mono">Nº${String(i + 1).padStart(3, '0')}</span></div>
        <div class="cl-name">${c.name}™</div>
        <div class="cl-hex mono">${hexes.map((h) => h.toUpperCase()).join(' / ')}</div>`;
      card.onclick = () => show(i);
      grid.appendChild(card);
    });

    // Modal with previous / next (buttons, arrow keys, swipe).
    const $ = (id) => document.getElementById(id);
    const modal = $('clModal');
    let at = 0;
    function show(i) {
      at = (i + colors.length) % colors.length;
      const c = colors[at];
      const hexes = Array.isArray(c.hex) ? c.hex : [c.hex];
      $('clmColor').style.background = hexes.length > 1 ? `linear-gradient(90deg, ${hexes[0]} 50%, ${hexes[1]} 50%)` : hexes[0];
      $('clmNum').textContent = `Nº${String(at + 1).padStart(3, '0')}`;
      $('clmName').textContent = `${c.name}™`;
      $('clmHex').textContent = hexes.map((h) => h.toUpperCase()).join(' / ');
      $('clmDesc').textContent = c.desc || 'DESCRIPTION COMING SOON.';
      $('clmDesc').classList.toggle('is-soon', !c.desc);
      $('clmWhere').textContent = `FOUND IN: ${c.where.toUpperCase()}`;
      $('clmPos').textContent = `${at + 1} / ${colors.length}`;
      if (modal.hidden) { modal.hidden = false; document.body.style.overflow = 'hidden'; $('clmNext').focus(); }
      else modal.querySelector('.cl-sheet').animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: 220 });
    }
    function close() { modal.hidden = true; document.body.style.overflow = ''; grid.children[at].focus(); }
    $('clmPrev').onclick = () => show(at - 1);
    $('clmNext').onclick = () => show(at + 1);
    modal.addEventListener('click', (e) => { if (e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', (e) => {
      if (modal.hidden) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') show(at - 1);
      if (e.key === 'ArrowRight') show(at + 1);
    });
    let x0 = null;
    modal.addEventListener('touchstart', (e) => { x0 = e.touches[0].clientX; }, { passive: true });
    modal.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) show(at + (dx < 0 ? 1 : -1));
    });
  })();
</script>
</body>
</html>
