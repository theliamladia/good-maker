<!doctype html>
<!-- The share banner for /dynamics (assets/og-dynamics.png, 1200×630) and its RELEASES® card.
     Render: open at 1200×630 and screenshot. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Inter:wght@300;400&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0000ff; color: #fff; overflow: hidden; }
  body { display: grid; place-items: center; font-family: Inter, sans-serif; }
  .c { text-align: center; }
  img { width: 72px; image-rendering: pixelated; display: block; margin: 0 auto 30px; }
  .t { font: 400 13px 'Space Mono', monospace; letter-spacing: .3em; opacity: .85; margin: 0 0 34px; }
  svg { display: block; height: 70px; margin: 0 auto; overflow: visible; }
  .l { font: 300 24px Inter, sans-serif; margin: 36px 0 0; opacity: .92; }
  .f { position: absolute; bottom: 44px; font: 400 12px 'Space Mono', monospace; letter-spacing: .26em; opacity: .75; }
  .f.a { left: 90px; } .f.b { right: 90px; }
</style></head>
<body>
  <div class="c">
    <img src="/assets/crate3.svg" alt="">
    <p class="t">GOOD® CRATE Nº003 · DYNAMICS® I</p>
    <svg id="logo"></svg>
    <p class="l">Tomorrow is Today.</p>
  </div>
  <p class="f a">OUT NOW · OPEN IT FOR 5 GOOD® COINS</p>
  <p class="f b">GOOD.LEEMS.ME/DYNAMICS</p>
<script src="/js/dynamics-lockup.js"></script>
<script>
  document.fonts.load('100px Michroma', 'DYNAMICS®').then(() => document.fonts.ready).then(() => {
    const svg = document.getElementById('logo');
    lockup(svg, { sq: 0.25, pos: 'lead', valign: 'centre', lift: 0.02, gap: 0.62, regPos: 'cap', size: 100, x: 0, y: 0 });
    const b = svg.getBBox(), pad = 4;
    svg.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + 2 * pad} ${b.height + 2 * pad}`);
    svg.style.width = `${70 * (b.width + 8) / (b.height + 8)}px`;
    document.body.dataset.ready = '1';
  });
</script>
</body></html>
