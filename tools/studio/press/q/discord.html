<!doctype html>
<!-- Q&G® launch infographic for Discord (1600×2000). Screenshot at that size. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1600px; height: 2000px; background: #0000ff; color: #fff; overflow: hidden; font-family: Inter, sans-serif; }
  .wrap { padding: 120px 150px 0; }
  .t { font: 400 16px 'Space Mono', monospace; letter-spacing: .3em; opacity: .85; margin: 0; }
  h1 { margin: 26px 0 0; font: 600 170px/0.9 Inter, sans-serif; letter-spacing: -.05em; }
  h1 sup { font-size: .24em; font-weight: 400; vertical-align: 2.8em; letter-spacing: 0; }
  .l { font: 300 30px/1.5 Inter, sans-serif; margin: 34px 0 0; max-width: 24em; opacity: .92; }
  .rule { height: 1px; background: rgba(255,255,255,.5); margin: 70px 0 50px; }
  .looks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 60px 50px; }
  .looks figure { margin: 0; text-align: center; }
  .looks .sp { height: 420px; display: grid; place-items: end center; background: radial-gradient(closest-side, rgba(255,255,255,.55), rgba(255,255,255,0) 100%); }
  .looks img { width: 150px; image-rendering: pixelated; }
  .looks figcaption { margin-top: 18px; }
  .p { display: block; font: 500 22px/1.35 Inter, sans-serif; letter-spacing: -.01em; }
  .c { display: inline-flex; align-items: center; gap: 10px; margin-top: 10px; font: 400 14px 'Space Mono', monospace; letter-spacing: .2em; opacity: .9; }
  .c i { width: 13px; height: 13px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.7); display: inline-block; }
  .bars { display: flex; height: 70px; margin-top: 22px; }
  .bars i { display: block; }
  .foot { position: absolute; left: 150px; right: 150px; bottom: 70px; display: flex; justify-content: space-between; font: 400 16px 'Space Mono', monospace; letter-spacing: .26em; }
  .story { margin-top: 60px; }
</style></head><body><div class="wrap">
  <p class="t">ROYALS &amp; GOOD® · OUT NOW</p>
  <h1>Q&amp;G<sup>®</sup></h1>
  <p class="l">The latest collaborative effort between GOOD® and the People®. Six pieces, in MAKER® now.</p>
  <div class="rule"></div>
  <div class="looks" id="looks"></div>
  <div class="story"><p class="t">THE COLOR STORY®</p><div class="bars"><i style="background:#17171a;flex:3"></i><i style="background:#12235c;flex:2"></i><i style="background:#ebe8e1;flex:2"></i><i style="background:#3e3f44;flex:2"></i><i style="background:#8e9096;flex:1.4"></i><i style="background:#cfd2d6;flex:1"></i><i style="background:#d8b23c;flex:.6"></i></div></div>
</div>
<div class="foot"><span>OUT NOW IN MAKER®</span><span>GOOD.LEEMS.ME/Q</span></div>
<script>
  const C = { ONYX: '#17171a', ROYAL: '#12235c', PEARL: '#ebe8e1', GRAPHITE: '#3e3f44', ASH: '#8e9096', SILVER: '#cfd2d6', GOLD: '#d8b23c' };
  const LOOKS = [['FENCING JACKET® · FENCING PANT®', 'ONYX/SILVER'], ['FENCING JACKET® · FENCING PANT®', 'ROYAL/SILVER'], ['CLASP JACKET® · BIKER PANT®', 'PEARL/GOLD'],
    ['CLASP JACKET® · STUDDED BIKER PANT®', 'ONYX/SILVER'], ['BABY® CROPPED JACKET · FENCING PANT®', 'ONYX/PEARL'], ['BABY® CROPPED JACKET · BIKER PANT®', 'PEARL/ONYX']];
  document.getElementById('looks').innerHTML = LOOKS.map(([p, cw], i) => `<figure><div class="sp"><img src="/tools/studio/work/out/qglooks-sheets/qg-${i + 1}.png"></div><figcaption><span class="p">${p}</span><span class="c">${cw.split('/').map((c) => `<i style="background:${C[c]}"></i>`).join('')}${cw.split('/').map((c) => c + '™').join('/')}</span></figcaption></figure>`).join('');
</script></body></html>
