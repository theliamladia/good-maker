<!doctype html>
<!-- GOOD® FRIDAY PROGRAMME®: share banner (1200×630). Left third: a close-up of the model in the
     outfit; right two thirds: GOOD® in Inter, FRIDAY PROGRAMME® in a thin serif.
     The pieces are a preview: render this to the scratchpad only, never commit the PNG until it ships.
     Render: node tools/studio/sheet.js tools/studio/press/friday/og.html out.png 1200 1 --clip=1200x630 -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Cormorant+Garamond:wght@300&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #0000ff; color: #fff; overflow: hidden; }
  .shot { position: absolute; left: 0; top: 0; width: 400px; height: 630px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, #2a2aff 0%, #0000ff 70%); }
  .shot img { display: block; width: 400px; height: 630px; object-fit: cover; image-rendering: pixelated; }
  .rule { position: absolute; left: 400px; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.55); }
  .type { position: absolute; left: 480px; right: 80px; top: 50%; transform: translateY(-52%); }
  .good { margin: 0; font: 600 92px/1 Inter, sans-serif; letter-spacing: -.045em; }
  .good sup { font-size: .32em; vertical-align: 1.75em; letter-spacing: 0; font-weight: 600; }
  .prog { margin: 22px 0 0; font: 300 64px/1.02 'Cormorant Garamond', serif; letter-spacing: .02em; }
  .prog sup { font-size: .34em; vertical-align: 1.6em; }
  .cw { margin: 34px 0 0; font: 400 14px 'Space Mono', monospace; letter-spacing: .26em; opacity: .85; }
  .foot { position: absolute; right: 80px; bottom: 44px; font: 400 13px 'Space Mono', monospace; letter-spacing: .26em; opacity: .8; }
</style></head><body>
  <div class="shot"><img src="../../work/out/friday-close/close-crop.png" alt=""></div>
  <div class="rule"></div>
  <div class="type">
    <p class="good">GOOD<sup>®</sup></p>
    <p class="prog">FRIDAY PROGRAMME<sup>®</sup></p>
    <p class="cw">MERLOT™/KHAKI™</p>
  </div>
  <p class="foot">GOOD.LEEMS.ME</p>
</body></html>
